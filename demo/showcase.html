e emphasis</h2><p> Use <strong>&lt;strong&gt;</strong> for strong importance, seriousness, or urgency — the framework paints it at <strong>font-weight 700</strong> which reads visibly heavier than body copy. Use <em>&lt;em&gt;</em> for stress emphasis on a word the reader should mentally inflect — the framework keeps the UA <em>italic</em> tradition. Combine when needed: a phrase like <strong><em>strongly emphasized</em></strong> reads as both important AND inflected. </p><p><small>&lt;small&gt;</small> drops the font-size for fine print, legal disclaimers, and metadata adjacent to body copy. <mark>&lt;mark&gt;</mark> highlights text the reader&#39;s attention is being drawn to — search-result hits, document annotations, or &quot;new&quot; indicators in a feed. The framework&#39;s mark chrome uses a warm tinted background that survives both light and dark mode without inverting. </p><p> Two non-semantic decorations: <u>&lt;u&gt;</u> renders an underline (useful for misspellings, proper names in CJK text, or annotation rendering) — the framework distinguishes it from <code>&lt;a&gt;</code> via a <em>dashed</em> underline so a reader doesn&#39;t mistake a misspelling marker for a link. <s>&lt;s&gt;</s> renders strike-through text for content that is no longer accurate or relevant (NOT for edits — use <code>&lt;del&gt;</code> for those, §Edits). </p></section><section id="typography-edits"><h2>Edits — <code>&lt;ins&gt;</code> and <code>&lt;del&gt;</code></h2><p><code>&lt;ins&gt;</code> marks <ins>inserted text</ins> in a document revision; <code>&lt;del&gt;</code> marks <del>deleted text</del>. The framework tints insertions with a success-leaning hue (so they read as &quot;added&quot;) and deletions with a danger- leaning hue + strike-through (so they read as &quot;removed&quot;). Both elements ship a <code>cite</code> attribute and a <code>datetime</code> attribute for machine-readable metadata — neither has a visual treatment by default (visualizing them is a consum
