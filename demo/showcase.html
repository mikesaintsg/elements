				background-color: var(--color-surface);
				font-size: var(--text-sm);
				cursor: grab;
				-webkit-user-select: none;
				user-select: none;
				border-radius: 999px;
				transition:
					background-color 0.15s,
					transform 0.15s,
					opacity 0.15s;
				display: inline-flex;
			}
			.showcase-drag-badges [draggable='true']:hover {
				background-color: var(--color-surface-raised);
			}
			.showcase-drag-badges [draggable='true']:active {
				cursor: grabbing;
				transform: scale(0.97);
			}
			.showcase-drag-badges [draggable='true'].dragging {
				opacity: 0.5;
			}
			.showcase-drag-badges [draggable='true'].primary {
				background-color: color-mix(in oklab, var(--color-primary) 14%, var(--color-surface));
				border-color: var(--color-primary);
			}
			.showcase-drag-badges [draggable='true'].success {
				background-color: color-mix(in oklab, var(--color-success) 14%, var(--color-surface));
				border-color: var(--color-success);
			}
			.showcase-drag-badges [draggable='true'].warning {
				background-color: color-mix(in oklab, var(--color-warning) 18%, var(--color-surface));
				border-color: var(--color-warning);
			}
			.showcase-drag-badges [draggable='true'].danger {
				background-color: color-mix(in oklab, var(--color-danger) 14%, var(--color-surface));
				border-color: var(--color-danger);
			}
			.showcase-drop-zone {
				padding: calc(var(--spacing) * 8) calc(var(--spacing) * 4);
				border: 2px dashed var(--color-border);
				border-radius: var(--radius-md);
				background-color: var(--color-surface);
				color: var(--color-text-muted);
				text-align: center;
				transition:
					border-color 0.15s,
					background-color 0.15s,
					color 0.15s;
			}
			.showcase-drop-zone[data-over='true'] {
				border-color: var(--color-primary);
				background-color: color-mix(in oklab, var(--color-primary) 10%, var(--color-surface));
				color: var(--color-text);
				border-style: solid;
			}
			.showcase-focus-trap {
				padding: calc(var(--spacing) * 6);
				border: 2px solid var(--color-border);
				border-radius: var(--radius-md);
				background-color: var(--color-surface);
				margin-block-start: calc(var(--spacing) * 3);
				transition:
					border-color 0.15s,
					background-color 0.15s;
			}
			.showcase-focus-trap[data-active='true'] {
				border-color: var(--color-primary);
				background-color: color-mix(in oklab, var(--color-primary) 4%, var(--color-surface));
			}
			form[data-form-validated] :where(input, select, textarea):invalid {
				border-color: var(--color-danger);
				background-color: color-mix(in oklab, var(--color-danger) 8%, var(--color-canvas));
				box-shadow: 0 0 0 1px color-mix(in oklab, var(--color-danger) 35%, transparent);
				border-width: 2px;
			}
			form[data-form-validated] :where(input, select, textarea):invalid:focus-visible {
				box-shadow:
					0 0 0 1px var(--color-danger),
					0 0 0 var(--set-focus-box-shadow-width)
						color-mix(
							in oklab,
							var(--color-danger) calc(var(--set-focus-box-shadow-opacity) * 100%),
							transparent
						);
				outline: none;
			}
			form[data-form-validated] :where(input, select, textarea):valid {
				border-color: color-mix(in oklab, var(--color-success) 60%, var(--color-border));
				background-color: color-mix(in oklab, var(--color-success) 4%, var(--color-canvas));
			}
			form[data-form-validated] label:has(:invalid) {
				color: var(--color-danger);
				font-weight: 600;
			}
			.showcase-toast-container {
				display: contents;
			}
			.showcase-toast-container.start > output[popover] {
				inset-inline-start: var(--set-toast-edge-inset);
				inset-inline-end: auto;
			}
			.showcase-event-log {
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
				font-size: var(--text-sm);
				margin: 0;
				padding: 0;
				list-style: none;
			}
			.showcase-event-log > li {
				align-items: center;
				gap: calc(var(--spacing) * 2);
				padding-block: calc(var(--spacing) * 1);
				border-block-end: 1px solid var(--color-border);
				display: flex;
			}
			.showcase-event-log > li > code {
				min-inline-size: 4rem;
			}
			.showcase-event-log > li > small {
				color: var(--color-text-muted);
				margin-inline-start: auto;
			}
			.showcase-spec {
				gap: calc(var(--spacing) * 3);
				grid-template-columns: 1fr;
				margin-block-start: calc(var(--spacing) * 4);
				display: grid;
			}
			@media (width>=32rem) {
				.showcase-spec {
					row-gap: calc(var(--spacing) * 4);
					column-gap: calc(var(--spacing) * 6);
					grid-template-columns: max-content 1fr;
				}
			}
			.showcase-spec dt {
				color: var(--color-text-strong);
				font-weight: 600;
			}
			.showcase-spec dd {
				font-size: var(--text-sm);
				color: var(--color-text-muted);
				margin: 0;
			}
			/*$vite$:1*/
		</style>
	</head>
	<body>
		<div id="app"></div>
	</body>
</html>
