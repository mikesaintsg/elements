bare <code>&lt;p&gt;</code> element ships at the body&#39;s default font size and line-height with zero margin (Tailwind preflight strips margin universally; the framework keeps it zeroed and lets layout — flex / grid <code>gap</code>, <code>&lt;section&gt;</code>&#39;s <code>--set-section-gap</code>, or a wrapping <code>.stack</code> — own the vertical rhythm). </p><p> Stacking paragraphs inside a <code>&lt;section&gt;</code> picks up <code>--set-section-gap</code> (16px by default) so successive paragraphs breathe without the legacy <code>margin-block: 1em</code> stack. Authors who need tighter or looser rhythm tune the section gap once at <code>:root</code>; every section on the page follows. </p><p> This is a third paragraph to make the rhythm visible. Notice how the gap between paragraphs is consistent without any margin on the paragraph itself — the framework&#39;s layout container owns the spacing. </p></section><section id="typography-emphasis"><h2>Inline emphasis</h2><p> Use <strong>&lt;strong&gt;</strong> for strong importance, seriousness, or urgency — the framework paints it at <strong>font-weight 700</strong> which reads visibly heavier than body copy. Use <em>&lt;em&gt;</em> for stress emphasis on a word the reader should mentally inflect — the framework keeps the UA <em>italic</em> tradition. Combine when needed: a phrase like <strong><em>strongly emphasized</em></strong> reads as both important AND inflected. </p><p><small>&lt;small&gt;</small> drops the font-size for fine print, legal disclaimers, and metadata adjacent to body copy. <mark>&lt;mark&gt;</mark> highlights text the reader&#39;s attention is being drawn to — search-result hits, document annotations, or &quot;new&quot; indicators in a feed. The framework&#39;s mark chrome uses a warm tinted background that survives both light and dark mode without inverting. </p><p> Two non-semantic decorations: <u>&lt;u&gt;</u> renders an underline (useful for misspellings, proper names in CJK text, or a kbd> + <kbd>K</kbd>. The framework paints kbd as a small badge with a border + tighter line-height so it reads as &quot;press this key&quot; rather than &quot;this is code.&quot; </li><li><code>&lt;samp&gt;</code> — sample output from a program, e.g. <samp>npm run dev</samp>. Same monospace as code but without the bg chip so it reads as &quot;the program&#39;s response&quot; rather than &quot;source you&#39;d type.&quot; </li><li><code>&lt;var&gt;</code> — a variable in a mathematical / programming expression, e.g. let <var>x</var> = 42. The framework keeps the UA italic styling so the variable visually distinguishes from constants and operators. </li></ul><p> A block-level code listing uses <code>&lt;pre&gt;</code> + <code>&lt;code&gt;</code> together. The bg + padding come from <code>&lt;pre&gt;</code>; the <code>&lt;code&gt;</code> inside loses its own chip chrome because the block owns the surface: </p><pre><code>// Pseudocode — useDialog wiring

 datetime="PT3M12S">3 minutes 12 seconds</time>). The framework adds tabular- numbers font-variant so a column of times aligns vertically. </p><p><code>&lt;data&gt;</code> wraps any value with a machine-readable <code>value</code> attribute — useful for product SKUs (<data value="SKU-31415">Wireless keyboard</data>), version numbers (<data value="2.4.0">v2.4</data>), or any other user-readable / machine-readable pair. Like <code>&lt;time&gt;</code>, the framework adds tabular numbers so number columns align. </p></section><section id="typography-position"><h2>Position adjustment — <code>&lt;sub&gt;</code> and <code>&lt;sup&gt;</code></h2><p><code>&lt;sub&gt;</code> renders subscript text — chemical formulas (H<sub>2</sub>O, CO<sub>2</sub>), mathematical indexing (<var>a</var><sub>1</sub>, <var>a</var><sub>2</sub>, … <var>a</var><sub>n</sub>), and the like. The framework keeps the UA position- adjustment and tunes the font-size so the subscript doesn&#39;t disrupt the body line- height. </p><p><code>&lt;sup&gt;</code> renders superscript text — exponents (E = mc<sup>2</sup>), ordinal markers (the 21<sup>st</sup> century), and footnote callouts (some claim<sup>1</sup>). Same line-height treatment as <code>&lt;sub&gt;</code>. </p></section><section id="typography-address"><h2>Address — <code>&lt;address&gt;</code></h2><p><code>&lt;address&gt;</code> wraps contact information for the nearest article or document ancestor. NOT for arbitrary postal addresses (HTML5 limits the element&#39;s meaning — a generic postal address in body copy is just a paragraph). The framework paints it at <code>--color-text-muted</code> with a small font so it reads as secondary metadata, mirroring the <code>&lt;hgroup&gt;</code> tagline convention. </p><address> Written by Ada Lovelace.<br> Reach out at <a href="mailto:ada@example.com">ada@example.com</a>.<br> Repo at <a href="#">github.com/example/repo</a>. </address></section><section id="typography-hr"><h2>Thematic break — <code>&lt;hr&gt;</code></h2><p><code>&lt;hr&gt;</code> represents a thematic break between paragraph-level pieces of content — a scene change in a narrative, a transition from one topic to another in a reference document. The framework paints a 1px divider line that follows the <code>--color-border</code> token so theme switching retunes it automatically. </p><hr><p> Notice how the rule above sits in the document flow with consistent vertical air above and below. Reach for <code>&lt;hr&gt;</code> when the change in topic is significant enough to warrant a horizontal break; for tighter visual separation between adjacent paragraphs, the section gap rhythm is usually sufficient. </p></section>`,10)}}),Zd={id:`lists-group-variants`},Qd={class:`group`},$d=H({__name:`ListsPage`,setup(e){let t=[`primary`,`secondary`,`tertiary`,`success`,`warning`,`danger`,`information`];return(e,n)=>(K(),q(G,null,[n[2]||=X(`<section id="lists-intro"><hgroup><h1>Lists</h1><p> Three list element families. <code>&lt;ul&gt;</code> + <code>&lt;ol&gt;</code> + <code>&lt;li&gt;</code> for ordered / unordered enumerations and bordered list-group chrome. <code>&lt;dl&gt;</code> + <code>&lt;dt&gt;</code> + <code>&lt;dd&gt;</code> for term / description pairs in a responsive grid. </p></hgroup><p> Tailwind v4 preflight zeroes every list&#39;s <code>padding-inline-start: 40px</code> + UA <code>list-style</code>. The framework restores both for bare <code>&lt;ul&gt;</code> / <code>&lt;ol&gt;</code> so a list still reads as a list. The <code>.group</code> modifier opts into the Bootstrap-style bordered list-group chrome — rows with shared radius, collapsed inter-item borders, variant tinting per row, and implicit actionable behavior when a row contains an <code>&lt;a&gt;</code> or <code>&lt;button&gt;</code>. </p></section><section id="lists-bare"><h2>Bare <code>&lt;ul&gt;</code> and <code>&lt;ol&gt;</code></h2><p> Bare lists ship 2rem inline indent + UA list-style. Nested <code>&lt;ul&gt;</code> cascades disc → circle ii flip from block-axis to inline-axis. Useful for stat panels, top-of-card metric rows, or any breakdown that reads better horizontally than as a vertical stack. </p><ul class="group horizontal"><li>Sales · <strong>$12,400</strong></li><li>Customers · <strong>342</strong></li><li>NPS · <strong>62</strong></li><li>Churn · <strong>1.2%</strong></li></ul></section><section id="lists-definition"><h2> Definition list — <code>&lt;dl&gt;</code> / <code>&lt;dt&gt;</code> / <code>&lt;dd&gt;</code></h2><p> Description lists pair terms with descriptions in a responsive grid. Below 640px the framework stacks single-column (a wide term would otherwise starve the description track on phone widths). At wider viewports the grid switches to <code>minmax(0, max-content) minmax(0, 1fr)</code> so the term column sizes to its content and the description fills the rest. </p><p><code>&lt;dt&gt;</code> ships medium font-weight (so the term reads as a label); <code>&lt;dd&gt;</code> reads at <code>--color-text-muted</code> and gets <code>overflow-wrap: anywhere</code> so long tokens, URLs, or identifiers wrap inside the grid track instead of widening the page. </p><dl><dt>Author</dt><dd>Ada Lovelace</dd><dt>First published</dt><dd>1843 — translator&#39;s notes on Menabrea&#39;s memoir of Babbage&#39;s Analytical Engine</dd><dt>Significance</dt><dd> Note G — describes an algorithm for computing Bernoulli numbers, widely cited as the first published computer program. </dd><dt><code>--color-primary-text-emphasis</code></dt><dd> A long framework token that demonstrates the overflow-wrap behavior — wraps inside the cell rather than pushing the page wider than the viewport. </dd></dl></section><section id="lists-best-practices"><h2>Best practices</h2><ul><li> Use <code>&lt;ul&gt;</code> for unordered enumerations (the order of items doesn&#39;t carry meaning) and <code>&lt;ol&gt;</code> when sequence matters (steps, rankings). </li><li> Reach for <code>&lt;ul class=&quot;group&quot;&gt;</code> w aption already conveys the image&#39;s purpose. </li><li> A <code>&lt;figure&gt;</code> can hold any self-contained payload: images, video, audio, code, quotes, tables, diagrams. The shared trait is &quot;can be moved away from the main flow without breaking comprehension&quot; — that&#39;s what makes it figure-worthy. </li><li> The <code>&lt;figcaption&gt;</code> must be the FIRST or LAST child of the <code>&lt;figure&gt;</code> (per HTML5 spec). The framework&#39;s flex-column layout handles either order — caption-first reads as a label / title, caption-last reads as attribution. </li><li> Don&#39;t reach for <code>&lt;figure&gt;</code> as a generic image wrapper. If there&#39;s no caption / attribution / cross-reference, the bare <code>&lt;img&gt;</code> is enough. The figure carries semantic weight — use it where that weight is meaningful. </li><li> For card chrome (shadow, padding, radius), compose with <code>&lt;article&gt;</code>. A bare <code>&lt;figure&gt;</code> never gets card chrome by default — the framework treats it as a semantic grouping element, not a presentational box. </li></ul></section>`,1)],64))}}),xp=H({__name:`SectioningPage`,setup(e){return(e,t)=>t[0]||=X(`<section id="sectioning-intro"><hgroup><h1>Sectioning content</h1><p> The HTML5 sectioning family. Each element creates a landmark for assistive tech and gives the page a structural backbone — heading rank, document outline, sticky-offset anchor landings, and the framework&#39;s body-grid app-shell layout all derive from these elements. </p></hgroup><p> Framework contribution: every sectioning element gets hydrated chrome so dropping it into a page makes the page <em>feel alive</em> without any extra wrapper divs. Nesting collapse means descendant sections don&#39;t double-pad; sticky-offset means deep links land their target heading clear of any pinned app bar. </p></section><section id="sectioning-main"><h2><code>&lt;main&gt;</code></h2><p> Primary content landmark. ONE per page (others must carry <code>hidden</code>). Framework hydrates as a flex-column container with a fluid inline padding gutter (<code>--set-main-padding-inline</code> = <code>clamp(1rem, 5vw, …)</code>) that narrows on mobile and widens on desktop, plus <code>--set-main-gap</code> rhythm between top-level children — no manual <code>&lt;div class=&quot;stack&quot;&gt;</code> needed. </p><p> This page is itself inside a <code>&lt;main&gt;</code> (the body-grid layout shell). The fluid gutter you see between the sidebar and this text is the framework&#39;s <code>--set-main-padding-inline</code> in action. </p></section><section id="sectioning-section"><h2><code>&lt;section&gt;</code></h2><p> A thematic grouping of content, typically with its own heading. Maps to the <code>region</code> ARIA landmark when given an accessible name (<code>aria-label</code> / <code>aria-labelledby</code>). NOT a generic layout box — use <code>&lt;div&gt;</code> for that. </p><p> Framework hydrates with <code>padding-block</code> and <code>gap</code> rhythm. Each section on this page (including this one) ships those defaults without any class. <strong>Nesting collapse:</strong> a <code>&lt;section&gt;</code> inside <code>&lt;main&gt;</code> / <code>&lt;section&gt;</code> / <code>&lt;article&gt;</code> / <code>&lt;dialog&gt;</code> opts out of its own <code>padding-block</code> — the parent already supplies the gutter, so successive sections don&#39;t stack two budgets of whitespace. </p><article><header><h3>Nested section demo</h3></header><p> Two sections inside this <code>&lt;article&gt;</code> — note that they don&#39;t double-pad. The article&#39;s own padding-block owns the outer rhythm; each section&#39;s <code>padding-block: 0</code> kicks in via the nesting-collapse rule. </p><section style="border-block-end:1px dashed var(--color-border);"><h4>First nested section</h4><p>Children here flow with the section&#39;s <code>gap</code> rhythm.</p></section><section><h4>Second nested section</h4><p>No <code>&lt;main&gt;</code>, so it paints as a tinted inline callout — not a rail. Variant classes (<code>.primary</code>, <code>.success</code>, <code>.warning</code>, <code>.danger</code>, …) retint the callout via the <code>--color-{variant}-bg-subtle</code> cascade. </p></aside><aside class="success"><p style="margin-block:0;"><strong>Success callout</strong> — same element, <code>.success</code> variant class. The whole framework&#39;s variant cascade applies. </p></aside><aside class="warning"><p style="margin-block:0;"><strong>Warning callout</strong> — pair the color with a text cue so the meaning survives color-blind and forced-colors readers. </p></aside></section><section id="sectioning-header-footer"><h2><code>&lt;header&gt;</code> + <code>&lt;footer&gt;</code></h2><p>Introductory and closing content. Both are context-aware:</p><ul><li> Inside <code>&lt;body&gt;</code> — page app bar / page footer band (the showcase&#39;s top bar and bottom <em>&quot;Elements framework&quot;</em> strip are these). </li><li>Inside <code>&lt;article&gt;</code> — card header / card footer band.</li><li> Inside <code>&lt;dialog&gt;</code> — modal header / modal footer band (see <a href="#/dialog-element">DialogElementPage</a>). </li><li> Inside <code>&lt;section&gt;</code> — section header / section footer (subtle, no band chrome — just semantic grouping). </li></ul><article><header><hgroup><h3>Card header demo</h3><p>Heading + tagline pattern using <code>&lt;hgroup&gt;</code></p></hgroup></header><p> Card body. The header above paints with a divider line; the footer below paints with one too. Both bands extend edge-to-edge of the card via the framework&#39;s article-header / article-footer chrome rules. </p><footer style="display:flex;gap:0.5rem;"><button type="button" class="primary">Save</button><button type="button" class="subtle">Cancel</button></footer></article></section><section id="sectioning-nav-search"><h2><code>&lt;nav&gt;</code> + <code>&lt;search&gt;</code></h2><p> Navigation and search landmarks. Like <code>&lt;aside&gt;</code>, they&#39;re context-aware: a top-level <code>&lt;nav&gt;</code> reads as the body-grid side rail (the sidebar on this page), an inline <code>&lt;nav&gt;</code> inside an article reads as an action row, and a bare <code>&lt;nav&gt; &gt; &lt;ol&gt;</code> is the breadcrumb pattern. </p><nav aria-label="Breadcrumb example"><ol><li><a href="#sectioning-intro">Home</a></li><li><a href="#sectioning-intro">Components</a></li><li><a href="#sectioning-intro">Sectioning</a></li><li aria-current="page">Nav + Search demo</li></ol></nav><p><code>&lt;search&gt;</code> is the HTML Living Standard&#39;s landmark for search / filter UI (Baseline 2023+). The framework treats bare <code>&lt;search&gt;</code> as a flex row hosting an <code>&lt;input&gt;</code> + optional submit button. The framework provides the row chrome; positioning inside a body-shell rail (pinned, scrolling, in-flow) is a consumer composition. The showcase sidebar wraps its <code>&lt;search&gt;</code> in a <code>.showcase-sidebar-region</code> wrapper that pins as a card above a separately-scrolling link list — see <code>app/browser/styles/showcase.css</code> for the composed-rail pattern. </p><search><label><span class="sr-only">Site search</span><input type="search" placeholder="Search the docs…"></label><button type="button" class="primary">Search</button></search></section><section id="sectioning-hgroup"><h2><code>&lt;hgroup&gt;</code></h2><p> Heading + tagline grouping. A flex-column stack: a single heading (any level h1–h6) on top, one or more <code>&lt;p&gt;</code> taglines below at <code>--color-text-muted</code>. The pattern reads as &quot;headline + dek&quot; — common in articles, page intros, dialog headers. </p><hgroup><h3>Headline goes here</h3><p> And a tagline below in muted color, smaller weight — reads as metadata under the heading. </p></hgroup><p> See <a href="#/headings">HeadingsPage</a> for the full heading rank cascade and the <code>&lt;hgroup&gt;</code> chrome contract. </p></section><section id="sectioning-best-practices"><h2>Best practices</h2><ul><li><strong>One <code>&lt;main&gt;</code> per page</strong> — others must carry <code>hidden</code>. Maps to the <code>main</code> ARIA landmark; screen-reader users press a key to skip directly to its first child. </li><li><strong>Use <code>&lt;section&gt;</code> for thematic groupings with their own heading, not as a generic layout box.</strong> If there&#39;s no heading and no theme, <code>&lt;div&gt;</code> is the right element. </li><li><strong>Give <code>&lt;section&gt;</code> and <code>&lt;article&gt;</code> an accessible name</strong> (<code>aria-label</code> or <code>aria-labelledby</code>) so they register as discoverable regions in the assistive-tech landmark tree. </li><li><strong>Don&#39;t nest <code>&lt;main&gt;</code> inside <code>&lt;main&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;nav&gt;</code>, or <code>&lt;header&gt;</code></strong> (per HTML5 — content model violation). Sections nest fine; <code>&lt;main&gt;</code> is the document root for primary content. </li><li><strong>Sectioning elements DON&#39;T reset heading rank</strong> — an <code>&lt;h1&gt;</code> inside a nested <code>&lt;section&gt;</code> is still document-level h1. Use rank consistent with the document outline; don&#39;t decorate ranks based on nesting depth. </li></ul></section>`,9)}}),Sp=`data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 400'%3E%3Cdefs%3E%3ClinearGradient id='h' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23059669'/%3E%3Cstop offset='100%25' stop-color='%230891b2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='800' height='400' fill='url(%23h)'/%3E%3Ccircle cx='180' cy='120' r='60' fill='white' fill-opacity='0.22'/%3E%3Ccircle cx='620' cy='280' r='90' fill='white' fill-opacity='0.15'/%3E%3Cpath d='M0 300 L200 220 L400 270 L600 200 L800 240 L800 400 /code> as the first child and it picks up a tinted band with a divider. Drop an <code>&lt;img&gt;</code> as the first or last child and it bleeds to the card&#39;s outer edge with corners pinned to the inner radius. Drop a <code>&lt;ul class=&quot;group&quot;&gt;</code> and the list group&#39;s outer border drops — the card IS the panel edge. The framework reads the structure and paints the right chrome. </p></section><section id="article-bare"><h2>Bare <code>&lt;article&gt;</code></h2><p> No classes. Token-driven defaults: <code>--set-box-shadow-small</code> elevation, <code>--set-article-padding-*</code> for the inset, <code>--set-article-gap</code> between top-level children. Container-query named <code>article</code> so descendants can adapt to the card&#39;s intrinsic inline-size. </p><article><h3>The Analytical Engine</h3><p> The Analytical Engine has no pretensions whatever to <em>originate</em> anything. It can do <em>whatever we know how to order it</em> to perform. It can follow analysis; but it has no power of <em>anticipating</em> any analytical relations or truths. </p><p style="margin-block:0;color:var(--color-text-muted);font-size:0.875em;"> — Ada Lovelace, <cite>Notes on the Analytical Engine</cite>, 1843 </p></article></section><section id="article-slots"><h2>Auto-banded slots — <code>&lt;header&gt;</code> + <code>&lt;footer&gt;</code></h2><p> A direct-child <code>&lt;header&gt;</code> (first) and <code>&lt;footer&gt;</code> (last) pick up edge-to-edge banded chrome — subtle tinted bg, divider border, inner radius matched to the outer card edge minus the border width. The article zeroes its own padding on the matching edge (via <code>:has()</code>) so the band reaches the card&#39;s inner edge without negative-margin tricks. </p><article><header><h3 style="margin-block:0;">Account settings</h3><p style="margin-block:0;color:var(--color-text-muted);font-size:0.875em;"> Manage your profile, email, and notification preferences. </p></header><p style="m
