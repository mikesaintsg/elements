n id="layers"><h2>The five style layers</h2><p> Cascade-layer order: <code>theme, base, elements, components, surfaces, composables, modifiers, utilities</code>. Later layers win. </p><dl><dt><code>elements/</code></dt><dd>One partial per HTML tag. Token-driven baseline + UA-quirk reset.</dd><dt><code>components/</code></dt><dd>Element compositions that read as one UI thing — card, sidebar, navbar, toolbar.</dd><dt><code>surfaces/</code></dt><dd>Browser-rendered chrome — <code>[popover]</code>, <code>::backdrop</code>, scrollbar.</dd><dt><code>composables/</code></dt><dd> Component chrome gated on a composable&#39;s state attribute — drawer geometry, listbox layout, toast deck. </dd><dt><code>modifiers/</code></dt><dd>The six-dimension cascade.</dd></dl></section><section id="modifiers"><h2>The six modifier dimensions</h2><p>Each dimension is orthogonal — an element takes at most one value from each.</p><ul><li><strong>Variant</strong> — semantic identity (<code>primary</code>, <code>success</code>, <code>danger</code>, …)</li><li><strong>Size</strong> — physical scale (<code>small</code>, <code>large</code>, <code>huge</code>)</li><li><strong>Style</strong> — fill treatment (<code>outline</code>, <code>ghost</code>, <code>filled</code>)</li><li><strong>Shape</strong> — corner radius (<code>rounded</code>, <code>pill</code>, <code>square</code>)</li><li><strong>State</strong> — interaction state (<code>disabled</code>, <code>active</code>, <code>loading</code>)</li><li><strong>Placement</strong> — anchored placement (<code>top</code>, <code>bottom</code>, <code>start</code>, <code>end</code> + corners)</li></ul></section><section id="getting-started"><h2>Getting started</h2><p>Two CSS imports plus one TS import:</p><pre><code>/* user-entry.css */
