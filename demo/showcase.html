ode> as form stack. </dd><dt>Modifiers</dt><dd> Four orthogonal dimensions: <code>variant</code> (primary, success, danger…), <code>size</code> (small, large), <code>style</code> (filled, ghost), <code>state</code> (disabled, active, loading). Plus placement modifiers (<code>top</code>, <code>bottom</code>, <code>start</code>, <code>end</code>) for anchored surfaces. </dd><dt>Surfaces</dt><dd> Browser-rendered chrome that isn&#39;t a tag — <code>::backdrop</code>, <code>[popover]</code>, scrollbar styling, anchor positioning. </dd><dt>Composables</dt><dd> 20 Vue adapters paired with framework-agnostic factories — <code>useDialog</code>, <code>useDetails</code>, <code>useMenu</code>, <code>useTooltip</code>, <code>useToast</code>, <code>useTable</code>, <code>useForm</code>, <code>useSelect</code>, and more. Each gates on the semantically-correct host element. </dd></dl></section><section id="getting-around"><h2>Getting around</h2><p> The left rail lists every element, component, pattern, and composable by tag name. Press <kbd>/</kbd> to focus the filter input. Each element page demos the modifier cascade in action — start with <a href="#/article">article</a> if you want the flagship &quot;element IS component&quot; proof point, or <a href="#/button">button</a> for the simplest cascade walkthrough. </p></section><section id="composition"><h2>Composition example</h2><p>Every element below is bare HTML wearing nothing but framework modifier classes.</p><article><header><h3>Repository</h3></header><p> An <code>&lt;article&gt;</code> with a <code>&lt;header&gt;</code> slot, body content, and a <code>&lt;footer&gt;</code> action row. No <code>.card</code> / <code>.card-header</code> / <code>.card-body</code> / <code>.card-footer</code> classes — the descendant context tells the framework what to paint where. </p><footer class="showcase-row"><small>Updated 2 minutes ago</small><menu><button type="button">Skip</button><button type="button" class="primary">View</button></men
