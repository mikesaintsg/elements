0.5 font-mono text-sm">.large</code>, <code class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-sm">.ghost</code>, …) compose without per-element rules. </p></header><section id="types" class="space-y-3"><h2 class="text-xl font-semibold tracking-tight text-slate-900">Types</h2><p class="text-sm leading-6 text-slate-600"> The <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">type</code> attribute controls what the button does inside a form. Always declare it explicitly — the browser default is <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">submit</code>, which will unexpectedly submit the nearest form if omitted. </p><div class="flex flex-wrap items-center gap-2"><button type="button">Action</button><button type="submit">Submit</button><button type="reset">Reset</button></div></section><section id="variants" class="space-y-3"><h2 class="text-xl font-semibold tracking-tight text-slate-900">Variants</h2><p class="text-sm leading-6 text-slate-600"> Each variant modifier sets the four <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">--set-variant-*</code> context tokens. The button consumes them; no per-element variant rules. </p><div class="flex flex-wrap items-center gap-2"><button type="button" class="primary">Primary</button><button type="button" class="secondary">Secondary</button><button type="button" class="tertiary">Tertiary</button><button type="button" class="success">Success</button><button type="button" class="warning">Warning</button><button type="button" class="danger">Danger</button><button type="button" class="information">Information</button></div></section><section id="sizes" class="space-y-3"><h2 class="text-xl font-semibold tracking-tight text-slate-900">Sizes</h2><p class="text-sm leading-6 text-slate-600"> Size modifiers route Tailwind&#39;s <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">--spacing</code>, <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">--text-*</code>, and <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">--radius-*</code> scales into <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">--set-size-*</code> context tokens. Two values: <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">.small</code> and <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">.large</code>. The bare element renders at the default size — there&#39;s no <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">.medium</code> because absence is the default. </p><div class="flex flex-wrap items-center gap-2"><button type="button" class="primary small">Small</button><button type="button" class="primary">Default</button><button type="button" class="primary large">Large</button></div></section><section id="styles" class="space-y-3"><h2 class="text-xl font-semibold tracking-tight text-slate-900">Styles</h2><p class="text-sm leading-6 text-slate-600"> Style modifiers re-route the variant&#39;s color through <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">--set-style-*</code> tokens. <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">.ghost</code> renders the variant color as text only against a transparent surface; <code class="rounded bg-slate-100 px-1 py-0.5 font-mono text-xs">.filled</code> is the explicit filled state. </p><div class="flex flex-wrap items-center gap-2"><button type="button" class="primary ghost">Ghost</button><button type="button" class="primary filled">Filled</button></div><div class="flex flex-wrap items-center gap-2"><button type="button" class="success ghost">Success</button><button type="button" class="warning ghost">Warning</button><button type="button" class="danger ghost">Danger</button></div></section><section id="combined" class="space-y-3"><h2 class="text-xl font-semibold tracking-tight text-slate-900">Combined</h2><p class="text-sm leading-6 text-slate-600"> Modifiers compose freely — variant + size + style stack wi
